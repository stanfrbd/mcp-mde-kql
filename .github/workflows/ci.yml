name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format
        run: python -m ruff format --check src tests scripts
      - name: Security scan
        run: python -m bandit -q -r src
      - name: Types
        run: python -m mypy src
      - name: Build distribution
        run: python -m build
      - name: Check wheel CLI in isolated environment
        run: |
          python -m venv /tmp/mcp-wheel-check
          /tmp/mcp-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/mcp-wheel-check/bin/mcp-mde-kql --help

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-mde-kql"
version = "1.1.0"
description = "MCP server for Microsoft Defender Advanced Hunting - execute KQL queries via natural language"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "stanfrbd" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "microsoft-defender",
    "advanced-hunting",
    "kql",
    "security",
    "siem",
    "threat-hunting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.3,<3",
    "azure-identity>=1.15.0",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/stanfrbd/mcp-mde-kql"
Repository = "https://github.com/stanfrbd/mcp-mde-kql"
Issues = "https://github.com/stanfrbd/mcp-mde-kql/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mcp[cli]>=2.3,<3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.0",
    "ruff>=0.15.5",
    "mypy>=1.9.0",
    "bandit>=1.9.4",
    "pre-commit>=4.3.0",
]

[project.scripts]
mcp-mde-kql = "mcp_mde_kql.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mde_kql"]
include = ["/src/mcp_mde_kql/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mcp_mde_kql/**/*.py",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
